name: AgriNexus CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  root-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root
        run: npm ci
      - name: Typecheck root (api + server)
        run: npm run typecheck
      - name: Fieldlot RAG index sanity
        run: npm run check:fieldlot-rag

  fieldlot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldlot
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fieldlot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Start Fieldlot API for smoke tests
        run: |
          npm exec -- tsx server/dev-api.ts > /tmp/fieldlot-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8789/api/fieldlot-chat > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fieldlot-api.log
          exit 1
      - run: npm test
